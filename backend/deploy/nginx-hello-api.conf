# Nginx site for the Hello API.
#
# HTTP-ONLY ON PURPOSE. `certbot --nginx` parses the live config, refuses to run
# if it does not validate, and then ADDS the 443 server block itself — copying
# these location blocks into it and putting a redirect here. A config that
# referenced a certificate before one existed would fail `nginx -t` and lock you
# out of obtaining one, which is the classic way this step goes wrong.
#
# `deploy/provision.sh` installs this and substitutes the domain. Step 5 of
# README.md runs certbot, after which this file contains both blocks.
#
# Replace api.example.com if installing by hand.

upstream hello_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Certbot's HTTP-01 challenge, and its renewals every 60 days.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The API is the only thing on this host; nothing is served from disk.
    root /var/www/html;

    # A request body is a bio or a message, never a file — there are no uploads
    # in this product, by design. Keep the ceiling low.
    client_max_body_size 256k;

    # Do not hand a scanner the nginx version.
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # ── Socket.IO ───────────────────────────────────────────────────────────
    #  Must come BEFORE the catch-all, and must carry Upgrade/Connection or the
    #  handshake never upgrades and falls back to polling forever. That failure
    #  is not an error anywhere — it looks like "messages only arrive when I
    #  reopen the chat", plus dead receipts and dead calls. `scripts/smoke.sh`
    #  checks this specifically, because nothing else would catch it.
    location /socket.io/ {
        proxy_pass http://hello_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A socket is idle between messages and must not be culled for it.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://hello_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ── If a second Node process is ever added ──────────────────────────────
    #  Socket.IO needs STICKY SESSIONS: the handshake and the upgrade must reach
    #  the same process, and the default round-robin sends them to different
    #  ones. That is `ip_hash;` in the upstream block PLUS a Redis adapter in
    #  src/sockets/io.ts, and neither is in place — so today this must stay ONE
    #  process. Adding a second without both works in testing and breaks under
    #  load, which is the worst way for it to break.
}
